name: Release

# Cut a release with:  npm version patch   (or minor / major)
#                      git push --follow-tags
# That bumps package.json and server.json, tags vX.Y.Z, and this workflow
# tests, publishes to npm and the MCP Registry, and creates a GitHub release.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance / trusted publishing, MCP Registry login

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRV_PKG=$(node -p "require('./server.json').packages[0].version")
          echo "tag=$TAG package.json=$PKG server.json=$SRV/$SRV_PKG"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$SRV" ] || [ "$TAG" != "$SRV_PKG" ]; then
            echo "::error::Tag, package.json and server.json versions must match. Use 'npm version' to bump."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Trusted publishing needs npm 11.5+. With a trusted publisher configured
      # on npmjs.com no token is needed; otherwise set the NPM_TOKEN secret.
      - run: npm install -g npm@latest

      # Skipped when this version is already on npm, so a failed release can be
      # finished with "Re-run jobs" (npm never allows republishing a version).
      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "devpulse-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "devpulse-mcp@${VERSION} is already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The MCP Registry checks that the npm version exists, and npm can take a
      # few minutes to serve a new version (v0.1.3 took over 100s).
      - name: Wait for npm to serve the new version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 40); do
            if curl -fsS "https://registry.npmjs.org/devpulse-mcp/${VERSION}" >/dev/null; then
              echo "npm serves devpulse-mcp@${VERSION}"; exit 0
            fi
            echo "Not visible yet ($attempt/40); waiting 15s"; sleep 15
          done
          echo "::error::devpulse-mcp@${VERSION} not visible on npm after 10 minutes"; exit 1

      - name: Publish to the MCP Registry
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # npm can take a moment to make a new version visible to the registry's check.
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "Retrying in 20s ($attempt/5)"; sleep 20
          done
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Notes = this version's section of CHANGELOG.md. (An awk version of this
          # matched every "## " heading and pulled in all older sections.)
          node scripts/release-notes.mjs "$VERSION" > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          # One-click Claude Desktop extension, attached to the release.
          node scripts/build-mcpb.mjs
          # Stable download link for the README: .../releases/latest/download/devpulse.mcpb
          cp "devpulse-${VERSION}.mcpb" devpulse.mcpb
          # Re-runnable: update an existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" "devpulse-${VERSION}.mcpb" devpulse.mcpb --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
              "devpulse-${VERSION}.mcpb" devpulse.mcpb
          fi

      - name: Announce
        # Each channel runs only if its secrets exist; with none set this is a no-op.
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node scripts/announce.mjs notes.md
